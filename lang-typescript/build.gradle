plugins {
    id 'antlr'
    id 'me.champeau.jmh' version '0.7.3'
    id 'application'
}

dependencies {
    antlr "org.antlr:antlr4:$antlr_version"
    implementation "org.graalvm.js:js:$graal_version"
    implementation "org.graalvm.polyglot:profiler:$graal_version"
    implementation "org.graalvm.polyglot:inspect:$graal_version"
    implementation "org.apache.commons:commons-text:1.14.0"

    testImplementation "org.graalvm.truffle:truffle-tck:$graal_version"
}

def generatedPackage = 'nl.cge.lang.typescript.parser'
def generatedOutputDir = "src/main/antlr-gen/${generatedPackage.replace('.', '/')}"

generateGrammarSource {
    outputDirectory = file(generatedOutputDir)
    arguments += ['-visitor', '-package', generatedPackage]
}
compileJava.dependsOn generateGrammarSource

sourceSets {
    main {
        antlr {
            // TypeScript language lexer and parser grammars.
            srcDirs = ['src/main/antlr']
            include 'TypeScriptLexer.g4', 'TypeScriptParser.g4'
        }
        java {
            srcDirs = ['src/main/java', "src/main/antlr-gen"]
        }
    }
}

String jmhIncludes = findProperty("jmhIncludes")
jmh {
    if (jmhIncludes != null) {
        includes = [jmhIncludes]
    }
}

application {
    mainClass = 'nl.cge.lang.typescript.Main'
}
